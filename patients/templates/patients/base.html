<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Health Prediction App{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'patient_list' %}">Health Prediction App</a>
      <a class="btn btn-success" href="{% url 'patient_create' %}">+ Add patient</a>
    </div>
  </nav>

  <div class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}

    <p class="text-muted small mt-4">
      AI remarks are for screening information only and are not medical advice.
    </p>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
